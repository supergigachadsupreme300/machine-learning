[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hand_gesture_controll"
version = "0.0.1"
description = "an project to help scrolling with hand gesture recognition"
authors = [
  { name = "TranVanQuy" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["hand_gesture_controll"]
include = ["pyproject.toml", "hand_gesture_controll/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["hand_gesture_controll"]
force-sort-within-sections = true

